<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Portfolio — Anh Hoang design review</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9e9e6;color:#171717;font:13px Arial,sans-serif}button,a{font:inherit;color:inherit}button{cursor:pointer}header{min-height:64px;padding:12px 24px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #cdcdca;background:#f8f8f6}header strong{font-weight:500}header span{color:#60605c}.views{display:flex;margin-left:auto;gap:4px}.views button{min-height:36px;padding:0 16px;border:1px solid transparent;background:none}.views button[aria-pressed=true]{background:#181818;color:white}a{text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid #3049d9;outline-offset:3px}.stage{padding:24px;display:flex;justify-content:center}iframe{display:block;width:100%;height:calc(100vh - 145px);min-height:660px;border:1px solid #cdcdca;background:white}.stage.mobile iframe{width:390px;height:844px;min-height:0}footer{display:flex;gap:24px;justify-content:space-between;padding:0 24px 16px;color:#555550;font-size:12px}footer p{margin:0;line-height:1.5}@media(max-width:600px){header{padding:12px 16px;gap:12px;flex-wrap:wrap}header span{display:none}.views{gap:0}.views button{padding:0 10px}.stage{padding:12px}.stage.mobile iframe{max-width:100%}iframe{height:calc(100svh - 156px)}footer{padding:0 16px 16px;display:block}footer p+p{margin-top:8px}}
  </style>
</head>
<body>
  <header><strong>AH / DESIGN REVIEW</strong><span>Introduction · Work · Interests · Rabbit hole · Say hello</span><div class="views" role="group" aria-label="Preview width"><button aria-pressed="true" data-view="desktop">Desktop</button><button aria-pressed="false" data-view="mobile">Mobile</button></div><a href="screen.html" target="_blank" rel="noopener">Open full size ↗</a></header>
  <div class="stage"><iframe src="screen.html" title="Anh Hoang portfolio prototype"></iframe></div>
  <footer><p>Find the wand in the rabbit hole to open the closing invitation.<br>Draft copy · portrait placeholder · doodle board coming soon</p><p>01 First screen → 02 Full homepage → 03 Motion & interactions</p></footer>
  <script>if(new URLSearchParams(location.search).get('view')==='mobile'){document.querySelector('.stage').classList.add('mobile');document.querySelector('[data-view=desktop]').setAttribute('aria-pressed','false');document.querySelector('[data-view=mobile]').setAttribute('aria-pressed','true')}document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.stage').classList.toggle('mobile',button.dataset.view==='mobile');document.querySelectorAll('[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));</script>
</body>
</html>
